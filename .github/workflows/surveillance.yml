name: Surveillance
on:
  push:
    branches: [dev, main, 'codex/**']
    paths: ['surveillance/**', '.github/workflows/surveillance.yml']
  pull_request:
    branches: [dev, main]
    paths: ['surveillance/**', '.github/workflows/surveillance.yml']
jobs:
  surveillance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: surveillance_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: surveillance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SURVEILLANCE_TEST_DATABASE_URL: postgresql://surveillance_test:test-only@127.0.0.1:5432/surveillance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: surveillance/requirements.txt
      - run: pip install -r surveillance/requirements.txt
      - run: python -m compileall -q surveillance
      - run: python -m unittest discover -s surveillance/tests -v
